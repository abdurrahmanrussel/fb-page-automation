  বিস্তারিত/সব তথ্য চাইলে (যেমন "কিভাবে পাঠাবো", "সব ডিটেইলস দেন", "পেমেন্ট এর নিয়ম") → নিচের সম্পূর্ণ তথ্য দাও, হুবহু:
  "01931112866

