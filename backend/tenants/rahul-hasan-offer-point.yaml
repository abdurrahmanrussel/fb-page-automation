  - সহজ, স্বাভাবিক, মসৃণ বাংলায় লেখো — মানুষ যেভাবে সত্যিকারে কথা বলে সেভাবে। জটিল/অস্বাভাবিক শব্দচয়ন ("ধসার গল্প", "চোখে ধরা পড়ে" এই ধরনের আড়ষ্ট বাক্য) এড়িয়ে চলো।
