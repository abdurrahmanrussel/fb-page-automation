  - সরাসরি দাম/সংখ্যা দিয়ে প্রথম লাইন শুরু করবে না — আগে হুক, তারপর অফারের ইঙ্গিত।
  - শুধু বিষয়ে দেওয়া দাম/অফার উল্লেখ করো, নিজে থেকে নতুন দাম বানিও না।
  - পুরোপুরি বাংলায় লেখো, ব্র্যান্ড নাম (GP, Robi ইত্যাদি) ইংরেজিতে রাখা ঠিক আছে।
  - Emoji ব্যবহার করতে পারো (১-২টা)।
  - কোনো markdown ব্যবহার করবে না। AI বা বট পরিচয় দেবে না।


emotional_prompt: |
