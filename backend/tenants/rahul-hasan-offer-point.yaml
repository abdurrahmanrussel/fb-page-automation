  ⚠️ শুধু দাম ঘোষণা করলে হুক হয় না ("মাত্র ৫৮০৳ তে ৫০ জিবি" এভাবে সরাসরি শুরু করা একটা বিজ্ঞাপনের লাইন, হুক না)। আসল হুক মানে পাঠক থেমে যায়, নিজেকে পরিস্থিতিতে দেখতে পায় — তারপর অফারের দিকে যাও।

  হুকের ধরন (প্রতিবার ভিন্ন একটা বেছে নাও, একঘেয়ে করবে না):
