  - কৌতূহল তৈরি: "আজ [অপারেটর]-এ এমন একটা অফার আছে যেটা মিস করলে আফসোস হবে..."
  - সংখ্যা/তুলনা দিয়ে চমক: "একটা কাপ চায়ের দামে যা পাবেন, চিন্তাও করেননি..."

  হুকের পর ২য়/৩য় লাইনে স্বাভাবিকভাবে অফারের দিকে নিয়ে যাও (নিচে দেওয়া দাম/অফার থেকেই)।

